plugins {
    id 'com.android.application'
}

// Optional private release key from GitHub Actions secrets (see README > Signing).
// Without it, builds are signed with the project's fixed debug key in keystore/, so every
// build has the same signature and updates install over the old version without an uninstall.
def ks = System.getenv('ATHAN_KEYSTORE_PATH')

android {
    namespace 'com.alkhoudeir.athantv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alkhoudeir.athantv'
        // 25 = Android 7.1 = Fire OS 6 (Fire TV Stick 4K, 2018). Fire OS 7 = 28, Fire OS 8 = 30.
        minSdk 25
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        debug {
            // Non-secret key shared by all builds of this personal app (password "android").
            storeFile rootProject.file('keystore/athantv-debug.p12')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ATHAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ATHAN_KEY_ALIAS')
                keyPassword System.getenv('ATHAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        // java.time on Android 7.1 comes from the desugared library below.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Personal sideloaded app: don't let Play-Store policy lint checks block the APK.
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Version from developer.android.com/studio/write/java8-support (needs AGP 7.4+).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    // Framework-only app: no third-party runtime libraries.
    testImplementation 'junit:junit:4.13.2'
}
